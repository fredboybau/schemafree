[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemafree"
version = "0.4.1"
description = "Schema-agnostic federated self-supervised learning for cross-cohort cervical lesion representation"
requires-python = "==3.9.*"
license = { text = "MIT" }
dependencies = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "scikit-learn==1.3.2",
    "pillow==10.1.0",
    "einops==0.7.0",
    "gin-config==0.5.0",
    "plac==1.4.3",
    "onnx==1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "ruff==0.1.14",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.8.0",
    "pre-commit==3.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "UP007"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_decorators = false
disable_error_code = ["no-untyped-call", "no-any-return"]
files = ["src/schemafree"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "scipy.*",
    "sklearn.*",
    "gin.*",
    "plac.*",
    "einops.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
